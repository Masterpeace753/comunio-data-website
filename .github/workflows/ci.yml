name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comunio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comunio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/comunio_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os
          import time

          import psycopg2

          database_url = os.environ["TEST_DATABASE_URL"]
          last_error = None
          for _ in range(30):
              try:
                  with psycopg2.connect(database_url) as connection:
                      with connection.cursor() as cursor:
                          cursor.execute("SELECT 1")
                  print("PostgreSQL is ready")
                  break
              except psycopg2.OperationalError as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise RuntimeError(f"PostgreSQL did not become ready: {last_error}")
          PY

      - name: Run backend tests
        run: python -m pytest tests -vv --maxfail=1

      - name: Compile backend and operational scripts
        run: python -m compileall -q src tests ../scripts/aws/provision-api-readonly-user.py

      - name: Build API image
        run: docker build --file Dockerfile.api --tag comunio-backend-api:ci .

  terraform-check:
    name: Terraform validation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/aws/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: 1
