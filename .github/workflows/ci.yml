name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  TRIVY_DISABLE_TELEMETRY: 'true'

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comunio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comunio_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/comunio_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Check Python dependency and runtime support
        run: |
          python -m unittest discover -s ../scripts/tests -v
          python ../scripts/check_dependency_support.py python-packages
          python ../scripts/check_dependency_support.py runtime python "$(python -c 'import platform; print(platform.python_version())')"

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import os
          import time

          import psycopg2

          database_url = os.environ["TEST_DATABASE_URL"]
          last_error = None
          for _ in range(30):
              try:
                  with psycopg2.connect(database_url) as connection:
                      with connection.cursor() as cursor:
                          cursor.execute("SELECT 1")
                  print("PostgreSQL is ready")
                  break
              except psycopg2.OperationalError as error:
                  last_error = error
                  time.sleep(1)
          else:
              raise RuntimeError(f"PostgreSQL did not become ready: {last_error}")
          PY

      - name: Check PostgreSQL support
        run: |
          version="$(python -c 'import os, psycopg2; c = psycopg2.connect(os.environ["TEST_DATABASE_URL"]); cur = c.cursor(); cur.execute("SELECT current_setting('\''server_version_num'\'')::int / 10000"); print(cur.fetchone()[0]); c.close()')"
          python ../scripts/check_dependency_support.py runtime postgresql "$version"

      - name: Run backend tests
        run: python -m pytest tests -vv --maxfail=1

      - name: Compile backend and operational scripts
        run: python -m compileall -q src tests ../scripts/aws/provision-api-readonly-user.py ../scripts/aws/manage-auth-secret.py

      - name: Build API image
        run: docker build --file Dockerfile.api --tag comunio-backend-api:ci .

      - name: Build ingest image
        run: docker build --file Dockerfile --tag comunio-backend-ingest:ci .

      - name: Check backend image dependencies and Python runtimes
        run: |
          for image in comunio-backend-api:ci comunio-backend-ingest:ci; do
            version="$(docker run --rm --network none --entrypoint python "$image" -c 'import platform; print(platform.python_version())')"
            python ../scripts/check_dependency_support.py runtime python "$version"
            docker run --rm -i --entrypoint python "$image" - python-packages < ../scripts/check_dependency_support.py
          done

      - name: Record built image IDs
        run: docker image inspect --format '{{.Id}} {{.RepoTags}}' comunio-backend-api:ci comunio-backend-ingest:ci

      - name: Report API image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: comunio-backend-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0

      - name: Report ingest image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: comunio-backend-ingest:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: 0

      - name: Block fixable image vulnerabilities
        run: |
          status=0
          for image in comunio-backend-api:ci comunio-backend-ingest:ci; do
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image" || status=1
          done
          exit "$status"

  vps-configuration:
    name: VPS deployment configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Compose profiles and security boundaries
        run: python3 infra/vps/tests/test_compose.py

      - name: Check systemd scheduler contract
        run: python3 infra/vps/tests/test_systemd.py

      - name: Verify systemd units and UTC schedule
        run: |
          systemd-analyze verify infra/vps/systemd/comunio-ingest@.service infra/vps/systemd/comunio-ingest.timer
          calendar="$(sed -n 's/^OnCalendar=//p' infra/vps/systemd/comunio-ingest.timer)"
          systemd-analyze calendar "$calendar"

      - name: Check lock contention
        run: |
          lock="$(mktemp)"
          trap 'rm -f "$lock"' EXIT
          exec 9>"$lock"
          flock -n 9
          status=0
          flock -n -E 75 "$lock" true || status=$?
          test "$status" -eq 75

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check dependency and runtime support
        run: |
          python3 ../scripts/check_dependency_support.py npm package-lock.json
          python3 ../scripts/check_dependency_support.py runtime nodejs "$(node -p 'process.versions.node')"
          python3 ../scripts/check_dependency_support.py runtime nextjs "$(node -p 'require("next/package.json").version')"
          python3 ../scripts/check_dependency_support.py runtime react "$(node -p 'require("react/package.json").version')"
          python3 ../scripts/check_dependency_support.py next-react "$(node -p 'require("next/package.json").version')" "$(node -p 'require("react/package.json").version')"

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Run frontend tests
        run: npm test

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  terraform-check:
    name: Terraform validation
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/aws/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Check Terraform support
        run: |
          version="$(terraform version -json | python3 -c 'import json, sys; print(json.load(sys.stdin)["terraform_version"])')"
          python3 ../../../scripts/check_dependency_support.py runtime terraform "$version"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit backend dependencies
        run: pip-audit --requirement backend/requirements.lock --require-hashes --strict

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan filesystem for vulnerabilities and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scanners: vuln,misconfig,secret
          ignore-unfixed: false
          trivyignores: trivyignore.txt
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          input: infra/aws/terraform
          trivyignores: trivyignore.txt
          severity: HIGH,CRITICAL
          exit-code: 1

  codeql:
    name: CodeQL (Python and JavaScript)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: python,javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
