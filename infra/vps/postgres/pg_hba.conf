# Unix-socket administration is limited to the postgres operating-system user.
local   all         postgres                           peer
local   all         all                                reject

# No plaintext PostgreSQL traffic, including on the private Compose network.
hostnossl all       all             all                reject

# Client certificates are validated against ssl_ca_file. The certificate CN
# must match the PostgreSQL role. The API role is only for the separately
# approved API profile and must have SELECT-only grants.
hostssl comunio    comunio_ingest  all                cert
hostssl comunio    comunio_api_readonly all            cert
