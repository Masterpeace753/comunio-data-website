name: comunio-vps

services:
  db-volume-init:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an explicitly selected immutable image reference}
    profiles:
      - bootstrap
    user: "0:0"
    entrypoint:
      - /usr/bin/install
    command:
      - -d
      - -m
      - "0700"
      - -o
      - ${POSTGRES_UID:?Set POSTGRES_UID from the selected image}
      - -g
      - ${POSTGRES_GID:?Set POSTGRES_GID from the selected image}
      - ${PGDATA:?Set PGDATA to the data directory supported by the selected PostgreSQL image}
    environment:
      PGDATA: ${PGDATA:?Set PGDATA to the data directory supported by the selected PostgreSQL image}
    volumes:
      - type: volume
        source: postgres-data
        target: ${PGDATA:?Set PGDATA to the data directory supported by the selected PostgreSQL image}
    network_mode: none
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

  db-initdb:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an explicitly selected immutable image reference}
    profiles:
      - bootstrap
    user: "${POSTGRES_UID:?Set POSTGRES_UID from the selected image}:${POSTGRES_GID:?Set POSTGRES_GID from the selected image}"
    entrypoint:
      - initdb
    command:
      - --username=postgres
      - --auth-local=peer
      - --auth-host=reject
      - --no-instructions
    environment:
      PGDATA: ${PGDATA:?Set PGDATA to the data directory supported by the selected PostgreSQL image}
    volumes:
      - type: volume
        source: postgres-data
        target: ${PGDATA:?Set PGDATA to the data directory supported by the selected PostgreSQL image}
    network_mode: none
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an explicitly selected immutable image reference}
    user: "${POSTGRES_UID:?Set POSTGRES_UID from the selected image}:${POSTGRES_GID:?Set POSTGRES_GID from the selected image}"
    entrypoint:
      - postgres
    command:
      - -c
      - listen_addresses=*
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/run/postgresql/server.crt
      - -c
      - ssl_key_file=/var/run/postgresql/server.key
      - -c
      - ssl_ca_file=/var/run/postgresql/ca.crt
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    environment:
      PGDATA: ${PGDATA:?Set PGDATA to the data directory supported by the selected PostgreSQL image}
      TZ: UTC
    volumes:
      - type: volume
        source: postgres-data
        target: ${PGDATA:?Set PGDATA to the data directory supported by the selected PostgreSQL image}
      - type: bind
        source: ./postgres/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/server.crt
        target: /var/run/postgresql/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/server.key
        target: /var/run/postgresql/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/ca.crt
        target: /var/run/postgresql/ca.crt
        read_only: true
        bind:
          create_host_path: false
    networks:
      - database
    expose:
      - "5432"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m,mode=0770,uid=${POSTGRES_UID:?Set POSTGRES_UID},gid=${POSTGRES_GID:?Set POSTGRES_GID}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "/var/run/postgresql", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ingest:
    image: ${INGEST_IMAGE:?Set INGEST_IMAGE to an immutable application image reference}
    profiles:
      - jobs
    user: "${APP_UID:?Set APP_UID for the container process}:${APP_GID:?Set APP_GID for the container process}"
    command:
      - python
      - -m
      - src.ingest.runner
      - --run-type
      - ${INGEST_RUN_TYPE:-manual}
      - --mode
      - snapshot
    environment:
      APP_ENV: production
      COMUNIO_REQUIRE_SECRET_MODE: "true"
      COMUNIO_SECRET_FILE: /run/secrets/comunio.json
      DATABASE_URL_FILE: /run/secrets/database-url
      TZ: UTC
    volumes:
      - type: bind
        source: ${VPS_SECRET_DIR:?Set VPS_SECRET_DIR outside the repository}/comunio.json
        target: /run/secrets/comunio.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_SECRET_DIR:?Set VPS_SECRET_DIR outside the repository}/database-url
        target: /run/secrets/database-url
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/ca.crt
        target: /run/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/ingest.crt
        target: /run/certs/ingest.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/ingest.key
        target: /run/certs/ingest.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
      - outbound
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/secrets:rw,noexec,nosuid,size=1m,mode=0700,uid=${APP_UID:?Set APP_UID},gid=${APP_GID:?Set APP_GID}
      - /run/certs:rw,noexec,nosuid,size=1m,mode=0700,uid=${APP_UID:?Set APP_UID},gid=${APP_GID:?Set APP_GID}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  api:
    image: ${API_IMAGE:-api-disabled:local}
    profiles:
      - api
    user: "${APP_UID:?Set APP_UID for the container process}:${APP_GID:?Set APP_GID for the container process}"
    command:
      - uvicorn
      - src.api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
      - --workers
      - "1"
    environment:
      APP_ENV: production
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
      LOGIN_RATE_LIMIT_SCOPE: global
      AUTH_SECRET_FILE: /run/secrets/auth.json
      API_PROXY_SECRET_FILE: /run/secrets/api-proxy-secret
      DATABASE_URL_FILE: /run/secrets/api-database-url
      TZ: UTC
    volumes:
      - type: bind
        source: ${VPS_SECRET_DIR:?Set VPS_SECRET_DIR outside the repository}/api-auth.json
        target: /run/secrets/auth.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_SECRET_DIR:?Set VPS_SECRET_DIR outside the repository}/api-proxy-secret
        target: /run/secrets/api-proxy-secret
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_SECRET_DIR:?Set VPS_SECRET_DIR outside the repository}/api-database-url
        target: /run/secrets/api-database-url
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/ca.crt
        target: /run/certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/api.crt
        target: /run/certs/api.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VPS_TLS_DIR:?Set VPS_TLS_DIR outside the repository}/api.key
        target: /run/certs/api.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/secrets:rw,noexec,nosuid,size=1m,mode=0700,uid=${APP_UID:?Set APP_UID},gid=${APP_GID:?Set APP_GID}
      - /run/certs:rw,noexec,nosuid,size=1m,mode=0700,uid=${APP_UID:?Set APP_UID},gid=${APP_GID:?Set APP_GID}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  postgres-data:

networks:
  database:
    internal: true
  outbound:
    driver: bridge
